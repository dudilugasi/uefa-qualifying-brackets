<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UEFA Qualifying Brackets</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="title-row">
    <h1>UEFA Champions League — Qualifying</h1>
    <div class="season" id="season"></div>
  </div>
  <div class="meta">
    <button class="btn" id="refresh" type="button">Refresh results</button>
    <span id="status"></span>
    <span id="source"></span>
    <span class="pin-hint" id="pin-hint"></span>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div class="comp-tabs" role="tablist" id="comp-tabs"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
</header>

<div class="entry-card" id="entry-card" role="tooltip" aria-hidden="true"></div>

<main>
  <div class="bracket-scroll">
    <div class="canvas" id="canvas">
      <svg class="wires" id="wires" aria-hidden="true"></svg>
      <div class="bracket" id="bracket"></div>
    </div>
  </div>
  <div class="legend">
    <div><b>1st / 2nd</b> columns = leg scores</div>
    <div><b>Bold</b> column = aggregate</div>
    <div>Highlighted row = advances</div>
    <div>Arrow = same team in the next round</div>
    <div><em>Italic</em> = not yet played / TBD</div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
