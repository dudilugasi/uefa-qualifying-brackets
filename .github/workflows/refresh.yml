name: Refresh data

on:
  schedule:
    # Tue/Wed/Thu 22:00 UTC — after full time whether Europe is on summer time
    # (late kick-off 19:00 UTC, done by 20:50) or winter (20:00, done by 21:50).
    # Cron has no idea about DST, so this is 01:00 in Israel now, midnight later.
    - cron: "0 22 * * 2,3,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm run refresh

      - name: Commit data.json if the bracket actually changed
        run: |
          # refresh() leaves the file untouched when the scrape found nothing
          # new, timestamp included, so any diff at all is a real change.
          if git diff --quiet -- data.json; then
            echo "Nothing new."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Refresh data" -- data.json
          git push
